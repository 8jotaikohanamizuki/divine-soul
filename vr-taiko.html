<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR石投げ踊り計画</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    h1 {
      position: absolute;
      top: 10px;
      left: 20px;
      z-index: 999;
      color: #333333;
    }
  </style>
</head>
<body>
  <!-- ここを修正 ↓↓↓ -->
  <a-scene embedded vr-mode-ui="enabled: false">
    <a-assets>
      <a-asset-item id="taiko" src="https://raw.githubusercontent.com/8jotaikohanamizuki/divine-soul/main/taikodrum3dmodel-v1.glb"></a-asset-item>
    </a-assets>
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 2 1"></a-light>
    <a-entity gltf-model="#taiko" position="0 0.8 -0.8" scale="1.5 1.5 1.5"></a-entity>
    <a-sky color="#e0e0e0"></a-sky>
  </a-scene>
</body>
</html>
