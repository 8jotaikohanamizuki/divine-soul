<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR石投げ踊り計画 - ARモード</title>
  <!-- A-Frame 1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js（A-Frame用カメラARライブラリ）を追加 -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- embedded arjs でカメラを背景として直接起動 -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="taiko" src="https://raw.githubusercontent.com/8jotaikohanamizuki/divine-soul/main/taikodrum3dmodel-v1.glb"></a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 2 1"></a-light>

    <!-- 画面中央の目の前に太鼓を配置 -->
    <a-entity 
      gltf-model="#taiko" 
      position="0 0 -2" 
      scale="1 1 1"
      rotation="0 0 0">
    </a-entity>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
