<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARサンプル</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* A-Frameの描画キャンバスを透明化 */
    .a-canvas {
      background-color: transparent !important;
    }
  </style>
</head>
<body>

  <!-- webxrでARモードを有効化し、背景透過（xr-mode-ui）を設定 -->
  <a-scene 
    webxr="optionalFeatures: hit-test, local-floor;"
    ar-mode-ui="enabled: true"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true;">

    <a-assets>
      <a-asset-item id="taiko" src="https://raw.githubusercontent.com/8jotaikohanamizuki/divine-soul/main/taikodrum3dmodel-v1.glb"></a-asset-item>
    </a-assets>
    
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 2 1"></a-light>
    
    <a-entity gltf-model="#taiko" position="0 0.8 -1.2" scale="1.5 1.5 1.5"></a-entity>
    
    <!-- ❌ <a-sky> は削除（背景を覆ってしまうため） -->

  </a-scene>
</body>
</html>
