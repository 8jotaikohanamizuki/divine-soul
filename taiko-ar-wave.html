<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3/three.js/ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylon.js@latest/babylon.min.js"></script>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam;">
    <!-- 太鼓の中心位置（0, 0, 0）を基準 -->
    <!-- ここに波紋エフェクトを追加予定 -->
    <a-camera-static arjs="hideXRUiOnExit: true; showXRUiOnLoad: true;"></a-camera-static>
  </a-scene>
</body>
</html>
